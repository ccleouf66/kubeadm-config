routingMode: native
autoDirectNodeRoutes: true
ipv4NativeRoutingCIDR: "192.168.0.0/16"
installNoConntrackIptablesRules: true
kubeProxyReplacement: true
k8sServiceHost: <kube-apiserver endpoint>
k8sServicePort: 6443
ipam:
  mode: "cluster-pool"
  operator:
    clusterPoolIPv4PodCIDRList: ["192.168.0.0/16"]
    clusterPoolIPv4MaskSize: 24
hubble:
  enabled: false
bpfClockProbe: true
bpf:
  datapathMode: veth
  masquerade: true
  distributedLRU:
    enabled: true
  mapDynamicSizeRatio: 0.08
  events:
    trace:
      enabled: false
encryption:
  enabled: false
l7Proxy: true
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true